:root {
  --fons: #fcfcfc;
  --text: #232323;
  --text-sec: #4f4f4f;
  --vora: #CCCCCC;
  --fons-flotant: rgba(255,255,255,0.97);
  --mida-min: 12.5px;      /* cap text per sota (excepcions: estil.md) */
  --ample-max: 960px;
  --font-titol: 'PPPangaia', sans-serif;
  --font-contingut: 'Merriweather', serif;
  --font-ui: 'Roboto', sans-serif;
}

/* ---------- Layout general ---------- */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: var(--fons);
  font-family: var(--font-contingut);
  font-size: 14px;
  line-height: 1.5;
  color: var(--text);
  -webkit-text-size-adjust: 100%;
}
.infografia-container {
  width: 100%;
  height: 100%;
  padding: 16px 12px 12px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ---------- Titulació ---------- */
h1.titol {
  font-family: var(--font-titol);
  font-weight: 500;
  font-size: 28px;
  line-height: 1.3;
  color: var(--text);
  margin: 0 0 12px;
  text-align: center;
  width: 100%;
  max-width: var(--ample-max);
}
h1.titol:has(+ .subtitol) { margin-bottom: 4px; }
.subtitol {
  font-family: var(--font-contingut);
  font-size: 14px;
  line-height: 1.5;
  color: var(--text-sec);
  margin: 0 0 12px;
  text-align: center;
  width: 100%;
  max-width: var(--ample-max);
}

/* ---------- Llegenda inline (sota la titulació) ---------- */
.llegenda-inline {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 4px 14px;
  margin: 0 0 8px;
  width: 100%;
  max-width: var(--ample-max);
  box-sizing: border-box;
}
.llegenda-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.35;
  color: var(--text);
}
.llegenda-item.petita { font-size: 12.5px; }
.llegenda-swatch {
  width: 16px;
  height: 12px;
  border-radius: 2px;
  flex-shrink: 0;
  border: 1px solid rgba(0,0,0,0.12);
}
.llegenda-swatch.linia { height: 3px; border: none; }

/* ---------- Zona del gràfic ---------- */
.mapa-wrapper {
  position: relative;
  width: 100%;
  max-width: var(--ample-max);
  flex: 1;
  min-height: 0;           /* CRÍTIC: permet que flex:1 funcioni en alçada */
}
svg#mapa { display: block; overflow: visible; }
svg#mapa[viewBox] { width: 100%; height: 100%; }   /* només mapes amb viewBox, si es demana */

/* Gràfics de diversos blocs (opcional). Les columnes de .blocs es
   defineixen a cada infografia. */
.blocs { display: grid; width: 100%; height: 100%; gap: 14px; }
.bloc { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.bloc-titol {
  font-family: var(--font-contingut);
  font-weight: 700;
  font-size: 15px;
  line-height: 1.5;
  color: var(--text);
  margin: 0 0 2px;
}
.bloc-subtitol {
  font-family: var(--font-contingut);
  font-size: 12.5px;
  line-height: 1.35;
  color: var(--text-sec);
  margin: 0 0 6px;
}
.bloc-grafic { position: relative; flex: 1; min-width: 0; min-height: 0; }
.bloc-grafic > svg { position: absolute; top: 0; left: 0; display: block; overflow: visible; }

/* ---------- Peu de pàgina ---------- */
.peu-pagina {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 6px;
  padding: 0;
  width: 100%;             /* OBLIGATORI: evita el centrat involuntari */
  max-width: var(--ample-max);
  box-sizing: border-box;
}
.font-text {
  flex: 1;
  padding-right: 14px;
  font-family: var(--font-contingut);
  font-size: 12.5px;
  line-height: 1.35;
  color: var(--text-sec);
  text-align: left;
}
.peu-textos {              /* si el peu té més d'una línia de text */
  flex: 1;
  min-width: 0;
  padding-right: 14px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.peu-textos .font-text { padding-right: 0; }
.logo-peu { height: 21px; width: auto; flex-shrink: 0; }

/* ---------- Caixes flotants: tooltip i popovers ---------- */
#tooltip, .info-popup {
  position: fixed;
  display: none;
  box-sizing: border-box;
  max-width: 260px;
  padding: 8px 10px;
  background: var(--fons-flotant);
  border: 1px solid var(--vora);
  border-radius: 4px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  font-family: var(--font-contingut);
  font-size: 13px;
  line-height: 1.35;
  color: var(--text);
}
#tooltip { pointer-events: none; z-index: 300; }
.info-popup { z-index: 200; max-height: calc(100vh - 16px); overflow-y: auto; }

/* ---------- Mòbil ---------- */
@media (max-width: 767px) {
  h1.titol { font-size: 20px; }
  .llegenda-item { font-size: 12.5px; }
  .bloc-titol { font-size: 14px; }
  .peu-pagina { flex-direction: column; align-items: flex-start; gap: 4px; }
  .font-text, .peu-textos { padding-right: 0; }
  .logo-peu { height: 18px; align-self: flex-end; }
}

/* ---------- Estils propis d'aquesta infografia ---------- */

/* Línia de temps: text, botó Play i pista */
.cronologia {
  display: flex;
  align-items: flex-start;
  width: 100%;
  max-width: var(--ample-max);
  min-height: 46px;
  flex-shrink: 0;
  margin: 0 0 8px;
}
.crono-control { display: flex; align-items: center; gap: 10px; min-height: 36px; flex-shrink: 0; margin-right: 10px; }
.crono-text {
  max-width: 190px;
  font-family: var(--font-contingut); font-size: 12.5px; line-height: 1.35; color: var(--text-sec);
}
.crono-pista { position: relative; flex: 1; min-width: 0; align-self: stretch; }
#svg-crono { position: absolute; top: 0; left: 0; display: block; overflow: visible; }
#btn-play {
  flex-shrink: 0;
  width: 28px; height: 28px; padding: 0; box-sizing: border-box; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  background: var(--fons-flotant); border: 1px solid var(--vora); color: var(--text);
}
#btn-play:hover { background: #f0f0f0; }
#btn-play svg { display: block; }
.crono-pom { cursor: grab; }
.crono-pom:focus { outline: none; }
.crono-pom:focus-visible circle { stroke: #0080EF; }

/* Blocs: 60% / 40% de l'alçada */
.blocs { grid-template-columns: 1fr; grid-template-rows: minmax(0, 3fr) minmax(0, 2fr); }
.bloc { overflow: hidden; }

/* Bloc 1: mapa i panell */
.bloc1 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; flex: 1; min-height: 0; }
#mapa-bici { position: relative; min-width: 0; min-height: 0; overflow: hidden; border-radius: 4px; }
#mapa-bici > svg { position: absolute; top: 0; left: 0; display: block; }
#any-mapa {
  position: absolute; top: 8px; left: 8px; z-index: 2;
  padding: 0 8px; border-radius: 4px; background: rgba(252,252,252,0.88);
  font-family: var(--font-ui); font-weight: 700; font-size: 40px; line-height: 1.2; color: var(--text);
}
/* El contingut del panell, centrat a l'espai disponible */
#panell {
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  min-width: 0; min-height: 0; overflow: hidden;
}
.panell-total {
  font-family: var(--font-contingut); font-weight: 700; font-size: 20px; line-height: 1.3;
  color: var(--text); margin: 0 0 8px; text-align: center;
}
.panell-total .xifra { font-family: var(--font-ui); font-size: 26.4px; }
#panell-llista { position: relative; flex: none; max-width: 100%; }
.op-fila {
  position: absolute; top: 0; left: 0;
  display: flex; align-items: center; gap: 10px; white-space: nowrap;
  font-family: var(--font-ui); font-size: 14px; line-height: 1.35; color: var(--text);
  transition: transform .6s ease, opacity .45s ease;
}
.op-fila.apilat { flex-direction: column; align-items: flex-start; justify-content: center; }
.op-cap { display: flex; align-items: center; flex-shrink: 0; }
.op-punt { display: block; flex-shrink: 0; border-radius: 50%; border: 1px solid #000; }
.op-fila .op-logo { flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.op-fila.apilat .op-logo { justify-content: flex-start; }
.op-fila .op-logo img { display: block; }
.op-fila b { font-weight: 700; }
.panell-missatge {
  /* dins de la llista, just a sota de la darrera fila i centrat */
  position: absolute; left: 50%; transform: translateX(-50%); width: max-content;
  padding: 6px 10px; box-sizing: border-box;
  background: #fff; border: 1px solid var(--vora); border-left: 3px solid var(--text); border-radius: 4px;
  font-family: var(--font-contingut); font-size: 13px; line-height: 1.35; color: var(--text);
}

@media (max-width: 767px) {
  .cronologia { margin-bottom: 6px; }
  .crono-text { max-width: 132px; }
  .blocs { grid-template-rows: minmax(0, 1fr); }
  #bloc2 { display: none; }
  .bloc1 { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  #any-mapa { font-size: 30px; }
  .panell-total { font-size: 17px; margin-bottom: 6px; }
  .panell-total .xifra { font-size: 22.8px; }
  .op-fila { font-size: 12.5px; gap: 6px; }
}
</style>
</head>
<body>
<div class="infografia-container">
  <h1 class="titol">Cada cop més operadors i més bicicletes compartides a Barcelona</h1>
  <div class="cronologia" id="cronologia">
    <div class="crono-control">
      <span class="crono-text">Clica play o mou el cercle per veure els canvis</span>
      <button id="btn-play" aria-label="Reprodueix"></button>
    </div>
    <div class="crono-pista" id="crono-pista"><svg id="svg-crono"></svg></div>
  </div>
  <div id="mapa-wrapper" class="mapa-wrapper">
    <div class="blocs">
      <div class="bloc" id="bloc1">
        <div class="bloc1">
          <div id="mapa-bici">
            <svg id="svg-mapa"></svg>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
/* ===================== UTILITATS COMUNES ===================== */
const MIDA_MIN = 12.5;                                   // px (estil.md)
const esMobil  = () => window.matchMedia('(max-width: 767px)').matches;
const potHover = () => window.matchMedia('(hover: hover)').matches;

/* Mides de text dins del SVG, en px (taula d'estil.md) */
function mides() {
  const m = esMobil();
  return {
    eix: 12.5,               // Roboto: valors d'eix i etiquetes inline
    titolEix: m ? 12.5 : 14, // Roboto: títols dels eixos
    nota: 12.5,              // Merriweather: notes i anotacions
    text: 14,                // Merriweather: text de contingut
    titolet: m ? 14 : 15     // Merriweather negreta: titolets dibuixats al SVG
  };
}

/* Amplada real d'un text (per calcular marges i si una etiqueta hi cap) */
const _ctx = document.createElement('canvas').getContext('2d');
function mesuraText(text, px, familia = 'Roboto', pes = 400) {
  _ctx.font = `${pes} ${px}px '${familia}', sans-serif`;
  return _ctx.measureText(text).width;
}

/* Format numèric català: punt als milers, coma decimal, màxim un decimal,
   sense zeros decimals finals, % enganxat a la xifra. Més decimals només si
   l'encàrrec ho demana explícitament (paràmetre decimals). */
const localeCA = d3.formatLocale({ decimal: ',', thousands: '.', grouping: [3], currency: ['', ' €'] });
function formatNum(val, sufix = '', decimals = 1) {
  const f = 10 ** decimals;
  const r = Math.sign(val) * Math.round(Math.abs(val) * f) / f;   // arrodoniment simètric
  let s = localeCA.format(`,.${decimals}f`)(r);
  if (s.includes(',')) s = s.replace(/0+$/, '').replace(/,$/, '');  // treu zeros decimals finals
  return s + sufix;
}
// formatNum(12.5, '%') → '12,5%' | formatNum(10, '%') → '10%' | formatNum(18074, ' €') → '18.074 €'
// formatNum(1.5, '', 2) → '1,5' | formatNum(1.25, '', 2) → '1,25'
// Eixos D3: .tickFormat(d => formatNum(d))

/* Tooltip: contingut en Merriweather; tots els textos acaben amb punt */
const tip = document.getElementById('tooltip');
function showTooltip(html) { tip.innerHTML = html; tip.style.display = 'block'; }
function moveTooltip(ev) {
  const M = 8, W = window.innerWidth, H = window.innerHeight;
  tip.style.left = '0px'; tip.style.top = '0px';       // força layout per mesurar
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + tw + M > W) x = ev.clientX - tw - 14;
  if (x < M) x = M;
  if (y + th + M > H) y = ev.clientY - th - 14;
  if (y < M) y = M;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function hideTooltip() { tip.style.display = 'none'; }
/* Hover als dispositius amb ratolí; clic a tots (tacte inclòs) */
function enllacaTooltip(sel, htmlFn) {
  sel.on('mouseover', (ev, d) => { if (potHover()) { showTooltip(htmlFn(d)); moveTooltip(ev); } })
     .on('mousemove', ev => { if (potHover()) moveTooltip(ev); })
     .on('mouseout', () => { if (potHover()) hideTooltip(); })
     .on('click', (ev, d) => { ev.stopPropagation(); showTooltip(htmlFn(d)); moveTooltip(ev); });
}
document.addEventListener('click', hideTooltip);

/* Popovers de les notes (interactivitat.md) */
function positionPopup(pop, btn) {
  const r = btn.getBoundingClientRect(), M = 8, W = window.innerWidth, H = window.innerHeight;
  pop.style.left = '0px'; pop.style.top = '0px';
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let x = r.right + 8, y = r.top;
  if (x + pw + M > W) x = r.left - pw - 8;
  if (x < M) x = M;
  if (y + ph + M > H) y = H - ph - M;
  if (y < M) y = M;
  pop.style.left = x + 'px'; pop.style.top = y + 'px';
}
function tancaPopups() {
  document.querySelectorAll('.info-popup').forEach(p => p.style.display = 'none');
}
function setupInfo(btn, pop, html) {
  const obre = () => { tancaPopups(); hideTooltip(); pop.innerHTML = html; pop.style.display = 'block'; positionPopup(pop, btn); };
  btn.addEventListener('mouseenter', () => { if (potHover()) obre(); });
  btn.addEventListener('mouseleave', () => { if (potHover()) tancaPopups(); });
  btn.addEventListener('click', ev => {
    ev.stopPropagation();
    if (potHover()) return;                       // amb ratolí ja s'ha obert amb el hover
    const visible = pop.style.display === 'block';
    tancaPopups();
    if (!visible) obre();
  });
  btn.addEventListener('keydown', ev => {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    ev.preventDefault();
    const visible = pop.style.display === 'block';
    tancaPopups();
    if (!visible) obre();
  });
}

const ANYS = DADES.anys;                                  // 2007–2026
const ANY_MIN = ANYS[0], ANY_MAX = ANYS[ANYS.length - 1];
const OPS = DADES.operadors.map(o => o.nom);
const VALORS = Object.fromEntries(DADES.operadors.map(o => [o.nom, o.valors]));
const valor = (op, any) => VALORS[op][any - ANY_MIN] || 0;
const totalAny = any => OPS.reduce((s, op) => s + valor(op, any), 0);
const MISSATGES = DADES.missatges;                        // { any: text }
const nomOp = (op, any) => (op === 'Bicing' && any >= 2019 ? 'Bicing 2.0' : op);

/* Colors dels operadors, propers als dels logos però distingibles entre si
   (excepció a colors.md, demanada a l'encàrrec) */
const COLORS = {
  'Bicing': '#D51922',          // vermell
  'Scoot': '#FF6A1F',           // vermell-taronja
  'Donkey Republic': '#F5A30A', // ambre
  'Yego': '#3E5068',            // gris blavós fosc
  'Bolt': '#2FCB7E',            // verd menta
  'Cooltra': '#0A7CFF',         // blau
  'Movi': '#8E1B3F',            // granat
  'Lime': '#8CD600',            // verd llima
  'Bird': '#2DC8F0',            // blau cel
  'Voi': '#F27BA5'              // rosa coral
};
const BICIS_PER_CERCLE = 25;

let anyActual = ANY_MIN;
let posicio = ANY_MIN;       // posició contínua de la rodona de la línia de temps

/* Escala d'anys (línia de temps i bloc 2) */
function escalaAnys(TW, esq = 4, drt = 4) {
  const x = d3.scaleBand().domain(ANYS).range([esq, TW - drt]).paddingInner(0.25).paddingOuter(0.1);
  x.c = a => x(a) + x.bandwidth() / 2;
  return x;
}
const anyMesProper = (x, px) => ANYS.reduce((m, a) => (Math.abs(x.c(a) - px) < Math.abs(x.c(m) - px) ? a : m));
/* Anys amb etiqueta: cada k anys, perquè no se solapin */
function anysVisibles(x, llista, pes = 400) {
  const ample = mesuraText('2000', mides().eix, 'Roboto', pes) + 6;
  const k = [1, 2, 3, 4, 5, 10].find(k => k * x.step() >= ample) || 10;
  const v = llista.filter((a, i) => i % k === 0);
  const ultim = llista[llista.length - 1];
  if (v[v.length - 1] !== ultim && x.c(ultim) - x.c(v[v.length - 1]) >= ample) v.push(ultim);
  return v;
}

/* ===================== LÍNIA DE TEMPS ===================== */
const svgC = d3.select('#svg-crono');
let crono = null;

function dibuixaCrono() {
  svgC.selectAll('*').remove();
  crono = null;
  const el = document.getElementById('crono-pista');
  const TW = el.clientWidth, TH = el.clientHeight;
  if (TW < 1) return;
  // La pista, a l'altura del centre del botó Play
  const rb = btnPlay.getBoundingClientRect(), rp = el.getBoundingClientRect();
  const Y = rb.top + rb.height / 2 - rp.top;
  svgC.attr('width', TW).attr('height', Math.max(TH, Y + 28));
  const MD = mides(), x = escalaAnys(TW, 10, 10), x0 = x.c(ANY_MIN), x1 = x.c(ANY_MAX);

  svgC.append('line').attr('x1', x0).attr('x2', x1).attr('y1', Y).attr('y2', Y)
    .attr('stroke', '#DADAD2').attr('stroke-width', 4).attr('stroke-linecap', 'round');
  const progres = svgC.append('line').attr('x1', x0).attr('y1', Y).attr('y2', Y)
    .attr('stroke', '#232323').attr('stroke-width', 4).attr('stroke-linecap', 'round');
  const ticks = svgC.append('g').selectAll('circle').data(ANYS).join('circle')
    .attr('cx', d => x.c(d)).attr('cy', Y).attr('r', 2.5);
  const etiquetes = svgC.append('g').selectAll('text').data(anysVisibles(x, ANYS, 700)).join('text')
    .attr('x', d => x.c(d)).attr('y', Y + 24).attr('text-anchor', 'middle')
    .style('font-family', 'Roboto, sans-serif').style('font-size', MD.eix + 'px').text(d => d);

  const arrossega = d3.drag().on('start drag', ev => vesAAny(anyMesProper(x, ev.x)));
  svgC.append('rect').attr('x', x0 - 14).attr('width', x1 - x0 + 28).attr('y', 0).attr('height', Y + 28)
    .attr('fill', 'transparent').style('cursor', 'pointer').call(arrossega);
  const pom = svgC.append('g').attr('class', 'crono-pom')
    .attr('tabindex', 0).attr('role', 'slider').attr('aria-label', 'Any')
    .attr('aria-valuemin', ANY_MIN).attr('aria-valuemax', ANY_MAX)
    .on('keydown', ev => {
      const pas = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[ev.key];
      if (pas) { ev.preventDefault(); vesAAny(anyActual + pas); }
      else if (ev.key === 'Home') { ev.preventDefault(); vesAAny(ANY_MIN); }
      else if (ev.key === 'End') { ev.preventDefault(); vesAAny(ANY_MAX); }
    })
    .call(arrossega);
  pom.append('circle').attr('r', 8).attr('fill', '#232323').attr('stroke', '#fff').attr('stroke-width', 2);

  crono = { x, Y, progres, ticks, etiquetes, pom };
  actualitzaCrono();
  posaPom();
}

/* Rodona i progrés, a la posició contínua (entre dos anys durant el Play) */
function posaPom() {
  if (!crono) return;
  const { x, Y } = crono, a = Math.floor(posicio);
  const cx = a >= ANY_MAX ? x.c(ANY_MAX) : x.c(a) + (posicio - a) * x.step();
  crono.progres.attr('x2', cx);
  crono.pom.attr('transform', `translate(${cx},${Y})`);
  crono.ticks.attr('fill', d => (d <= posicio ? '#232323' : '#AFAF97'));
}

function actualitzaCrono() {
  if (!crono) return;
  crono.pom.attr('aria-valuenow', anyActual);
  crono.etiquetes.attr('fill', d => (d === anyActual ? '#232323' : '#4f4f4f'))
    .style('font-weight', d => (d === anyActual ? 700 : 400));
}

/* Reproducció contínua: la rodona avança progressivament i els blocs canvien
   quan arriba a cada any. Els anys 2007–2015 duren la meitat que la resta. */
const btnPlay = document.getElementById('btn-play');
const ICONA_PLAY = '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 1.2L10.8 6L2.5 10.8Z" fill="#232323"/></svg>';
const ICONA_STOP = '<svg width="11" height="11" viewBox="0 0 11 11" aria-hidden="true"><rect x="1" y="1" width="9" height="9" rx="1" fill="#232323"/></svg>';
let reproduint = false, autoIniciat = false, darrerPas = null;
const duradaAny = a => (a < 2016 ? 750 : 1500);

function pintaBoto() {
  btnPlay.innerHTML = reproduint ? ICONA_STOP : ICONA_PLAY;
  btnPlay.setAttribute('aria-label', reproduint ? 'Atura' : 'Reprodueix');
}
function pasPlay(ts) {
  if (!reproduint) return;
  const dt = darrerPas == null ? 0 : Math.min(100, ts - darrerPas);
  darrerPas = ts;
  posicio = Math.min(ANY_MAX, posicio + dt / duradaAny(Math.floor(posicio)));
  setAny(Math.floor(posicio));
  posaPom();
  if (posicio >= ANY_MAX) aturaPlay();
  else requestAnimationFrame(pasPlay);
}
function iniciaPlay() {
  autoIniciat = true;
  if (posicio >= ANY_MAX) { posicio = ANY_MIN; setAny(ANY_MIN); posaPom(); }
  reproduint = true;
  darrerPas = null;
  pintaBoto();
  requestAnimationFrame(pasPlay);
}
function aturaPlay() {
  autoIniciat = true;
  reproduint = false;
  pintaBoto();
}
/* Salt manual a un any (arrossegant, clicant la pista o amb el teclat) */
function vesAAny(a) {
  aturaPlay();
  posicio = Math.max(ANY_MIN, Math.min(ANY_MAX, a));
  setAny(posicio);
  posaPom();
}
btnPlay.addEventListener('click', ev => { ev.stopPropagation(); if (reproduint) aturaPlay(); else iniciaPlay(); });
pintaBoto();

function setAny(a) {
  a = Math.max(ANY_MIN, Math.min(ANY_MAX, a));
  if (a === anyActual) return;
  anyActual = a;
  actualitzaCrono();
  actualitzaBicis();
  actualitzaPanell();
  actualitzaBloc2();
}

/* ===================== BLOC 1: MAPA ===================== */
const svgM = d3.select('#svg-mapa');
const COLOR_CARRER = '#F4F4F1', COLOR_VORERA = '#E3E3DB', COLOR_EDIFICI = '#CFCFC5';
let xarxa = null;          // carrers: nodes, veïns i Diagonal
let gBicis = null;
let bicis = [];            // { op, el, via, a, b, t, v, carril, px, py, r, estat, temps }

function dibuixaMapa() {
  const el = document.getElementById('mapa-bici');
  const W = el.clientWidth, H = el.clientHeight;
  if (W < 1 || H < 1) return;
  if (xarxa && xarxa.W === W && xarxa.H === H) return;      // només es refà si canvia la mida
  svgM.selectAll('*').remove();
  svgM.attr('width', W).attr('height', H);

  // Proporcions reals de l'Eixample: eixos cada 133,3 m, carrers de 20 m, xamfrans de 20 m
  const P = Math.max(64, Math.min(120, Math.min(W, H) / 3.4));
  const S = P * 0.15, X = P * 0.106, VOR = Math.max(2.5, P * 0.035);
  const eixos = (L, c) => { const v = []; for (let p = c - Math.ceil((c + 1.5 * P) / P) * P; p <= L + 1.5 * P; p += P) v.push(p); return v; };
  const xs = eixos(W, W / 2 + P * 0.35), ys = eixos(H, H / 2 + P * 0.2);

  svgM.append('rect').attr('width', W).attr('height', H).attr('fill', COLOR_CARRER);
  const octo = (x0, y0, x1, y1, c) =>
    `M${x0 + c},${y0}H${x1 - c}L${x1},${y0 + c}V${y1 - c}L${x1 - c},${y1}H${x0 + c}L${x0},${y1 - c}V${y0 + c}Z`;
  let dVorera = '', dEdifici = '', dPati = '';
  for (let i = 0; i < xs.length - 1; i++) {
    for (let j = 0; j < ys.length - 1; j++) {
      const x0 = xs[i] + S / 2, x1 = xs[i + 1] - S / 2, y0 = ys[j] + S / 2, y1 = ys[j + 1] - S / 2;
      const fons = (x1 - x0) * 0.27;
      dVorera += octo(x0, y0, x1, y1, X);
      dEdifici += octo(x0 + VOR, y0 + VOR, x1 - VOR, y1 - VOR, Math.max(0, X - VOR * 0.41));
      dPati += octo(x0 + VOR + fons, y0 + VOR + fons, x1 - VOR - fons, y1 - VOR - fons, X * 0.5);
    }
  }
  svgM.append('path').attr('d', dVorera).attr('fill', COLOR_VORERA);
  svgM.append('path').attr('d', dEdifici).attr('fill', COLOR_EDIFICI);
  svgM.append('path').attr('d', dPati).attr('fill', COLOR_VORERA);

  // Avinguda Diagonal (més ampla que la resta de carrers), baixant d'esquerra a
  // dreta. La vorera només es dibuixa dins de les illes (retallada amb el seu
  // contorn), de manera que a les cruïlles amb altres carrers no n'hi ha.
  const ang = 0.43, ux = Math.cos(ang), uy = Math.sin(ang);
  const ox = W * 0.42, oy = H * 0.6, L = W + H;
  const dA = [ox - ux * L, oy - uy * L], dB = [ox + ux * L, oy + uy * L];
  const D = S * 2.3;
  svgM.append('clipPath').attr('id', 'clip-illes').append('path').attr('d', dVorera);
  svgM.append('line').attr('x1', dA[0]).attr('y1', dA[1]).attr('x2', dB[0]).attr('y2', dB[1])
    .attr('stroke', COLOR_VORERA).attr('stroke-width', D + 2 * VOR).attr('clip-path', 'url(#clip-illes)');
  svgM.append('line').attr('x1', dA[0]).attr('y1', dA[1]).attr('x2', dB[0]).attr('y2', dB[1])
    .attr('stroke', COLOR_CARRER).attr('stroke-width', D);

  // Xarxa de carrers: nodes a les cruïlles (també fora de la vista, perquè els
  // ciclistes en surtin i hi tornin a entrar)
  const nodes = [], veins = [], ny = ys.length;
  xs.forEach((x, i) => ys.forEach((y, j) => {
    nodes.push([x, y]);
    const v = [];
    if (i > 0) v.push((i - 1) * ny + j);
    if (i < xs.length - 1) v.push((i + 1) * ny + j);
    if (j > 0) v.push(i * ny + j - 1);
    if (j < ny - 1) v.push(i * ny + j + 1);
    veins.push(v);
  }));
  // La Diagonal, retallada a la zona visible amb un marge
  const tVisibles = [];
  for (const [px, py] of [[-30, -30], [W + 30, -30], [-30, H + 30], [W + 30, H + 30]]) {
    tVisibles.push((px - dA[0]) * ux + (py - dA[1]) * uy);
  }
  const diag = { A: dA, ux, uy, s0: Math.max(0, d3.min(tVisibles)), s1: Math.min(2 * L, d3.max(tVisibles)), ample: D };

  xarxa = { W, H, P, S, nodes, veins, diag, R: Math.max(3.2, Math.min(4.8, P * 0.042)) };
  gBicis = svgM.append('g');
  // Els ciclistes que ja hi havia es recol·loquen a la xarxa nova
  bicis = bicis.filter(b => b.estat !== 'mor');
  bicis.forEach(b => { b.el = creaCercle(b.op); colocaBici(b, false); b.r = xarxa.R; b.estat = 'viu'; });
  if (!bicis.length) actualitzaBicis();
}

function creaCercle(op) {
  const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  c.setAttribute('stroke', '#000');
  c.setAttribute('stroke-width', 1);
  c.style.fill = COLORS[op];
  c.style.transition = 'fill 0.8s';
  gBicis.node().appendChild(c);
  return c;
}

/* Posició aleatòria; si dinsVista, sobre un carrer visible (per als que apareixen) */
function colocaBici(b, dinsVista) {
  const X = xarxa;
  b.v = X.P * (0.22 + Math.random() * 0.2);
  b.carril = X.S * (0.12 + Math.random() * 0.26);
  if (Math.random() < 0.1) {
    b.via = 'diag';
    b.dir = Math.random() < 0.5 ? 1 : -1;
    b.t = X.diag.s0 + Math.random() * (X.diag.s1 - X.diag.s0);
    b.carril = X.diag.ample * (0.08 + Math.random() * 0.36);
  } else {
    b.via = 'xarxa';
    for (let k = 0; k < 40; k++) {
      b.a = Math.floor(Math.random() * X.nodes.length);
      const v = X.veins[b.a];
      b.b = v[Math.floor(Math.random() * v.length)];
      b.t = Math.random() * X.P;
      const [mx, my] = posicioObjectiu(b);
      if (!dinsVista || (mx > 4 && mx < X.W - 4 && my > 4 && my < X.H - 4)) break;
    }
  }
  [b.px, b.py] = posicioObjectiu(b);
}

function posicioObjectiu(b) {
  const X = xarxa;
  if (b.via === 'diag') {
    const d = X.diag;
    return [d.A[0] + d.ux * b.t - d.uy * b.carril * b.dir, d.A[1] + d.uy * b.t + d.ux * b.carril * b.dir];
  }
  const [xa, ya] = X.nodes[b.a], [xb, yb] = X.nodes[b.b];
  const dx = (xb - xa) / X.P, dy = (yb - ya) / X.P;
  // Circulen per la dreta
  return [xa + dx * b.t - dy * b.carril, ya + dy * b.t + dx * b.carril];
}

function mouBici(b, dt) {
  const X = xarxa;
  if (b.via === 'diag') {
    b.t += b.v * dt * b.dir;
    if (b.t > X.diag.s1) { b.t = X.diag.s0; b.px = null; }
    else if (b.t < X.diag.s0) { b.t = X.diag.s1; b.px = null; }
  } else {
    b.t += b.v * dt;
    while (b.t >= X.P) {
      b.t -= X.P;
      const opcions = X.veins[b.b].filter(n => n !== b.a);
      const seg = opcions.length ? opcions[Math.floor(Math.random() * opcions.length)] : b.a;
      b.a = b.b;
      b.b = seg;
    }
  }
  const [tx, ty] = posicioObjectiu(b);
  if (b.px == null) { b.px = tx; b.py = ty; }
  const k = Math.min(1, dt * 8);              // suavitza els canvis de carril als girs
  b.px += (tx - b.px) * k;
  b.py += (ty - b.py) * k;
  if (b.estat === 'neix') { b.temps += dt; b.r = X.R * Math.min(1, b.temps / 0.35); if (b.temps >= 0.35) b.estat = 'viu'; }
  else if (b.estat === 'mor') { b.temps += dt; b.r = X.R * Math.max(0, 1 - b.temps / 0.4); }
  b.el.setAttribute('cx', b.px.toFixed(1));
  b.el.setAttribute('cy', b.py.toFixed(1));
  b.el.setAttribute('r', b.r.toFixed(2));
}

let darrerTemps = null;
function bucle(ts) {
  const dt = darrerTemps == null ? 0 : Math.min(0.05, (ts - darrerTemps) / 1000);
  darrerTemps = ts;
  if (xarxa) {
    let morts = false;
    for (const b of bicis) {
      mouBici(b, dt);
      if (b.estat === 'mor' && b.temps >= 0.4) { b.el.remove(); morts = true; }
    }
    if (morts) bicis = bicis.filter(b => !(b.estat === 'mor' && b.temps >= 0.4));
  }
  requestAnimationFrame(bucle);
}
requestAnimationFrame(bucle);

/* Cercles per operador (1 cada 50 bicicletes), repartits per la resta més gran */
function cerclesPerOperador(any) {
  const exactes = OPS.map(op => valor(op, any) / BICIS_PER_CERCLE);
  const total = Math.round(d3.sum(exactes));
  const n = exactes.map(Math.floor);
  const ordre = d3.range(OPS.length).sort((i, j) => (exactes[j] - n[j]) - (exactes[i] - n[i]));
  for (let k = 0; k < total - d3.sum(n); k++) n[ordre[k]]++;
  return Object.fromEntries(OPS.map((op, i) => [op, n[i]]));
}

/* Canvi d'any: primer es recoloreixen els cercles sobrants d'un operador cap als
   que en necessiten; només la diferència apareix o desapareix */
function actualitzaBicis() {
  document.getElementById('any-mapa').textContent = anyActual;
  if (!xarxa) return;
  const objectiu = cerclesPerOperador(anyActual);
  const vius = bicis.filter(b => b.estat !== 'mor');
  const perOp = d3.group(vius, b => b.op);
  const sobrants = [], falten = [];
  for (const op of OPS) {
    const llista = d3.shuffle((perOp.get(op) || []).slice());
    const dif = llista.length - objectiu[op];
    if (dif > 0) sobrants.push(...llista.slice(0, dif));
    else for (let k = 0; k < -dif; k++) falten.push(op);
  }
  d3.shuffle(sobrants);
  d3.shuffle(falten);
  const n = Math.min(sobrants.length, falten.length);
  for (let k = 0; k < n; k++) { sobrants[k].op = falten[k]; sobrants[k].el.style.fill = COLORS[falten[k]]; }
  for (let k = n; k < sobrants.length; k++) { sobrants[k].estat = 'mor'; sobrants[k].temps = 0; }
  for (let k = n; k < falten.length; k++) {
    const b = { op: falten[k], estat: 'neix', temps: 0, r: 0 };
    b.el = creaCercle(b.op);
    colocaBici(b, true);
    bicis.push(b);
  }
}

const llistaEl = document.getElementById('panell-llista');
const caixaMissatge = document.getElementById('panell-missatge');
const FILES_MAX = d3.max(ANYS, a => OPS.filter(op => valor(op, a) > 0).length);
const logos = {};          // op → { src, ratio } (retallats)
const files = {};          // op → { el, caixa, img, text, actiu }

/* Retalla el marge buit dels logos perquè tots tinguin una mida visual semblant */
function retallaLogo(img) {
  const w0 = img.naturalWidth || 300, h0 = img.naturalHeight || 100;
  const esc = Math.min(600 / w0, 240 / h0);
  const w = Math.round(w0 * esc), h = Math.round(h0 * esc);
  try {
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    const d = ctx.getImageData(0, 0, w, h).data;
    let xa = w, ya = h, xb = -1, yb = -1;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        if (d[i + 3] < 16 || (d[i] > 246 && d[i + 1] > 246 && d[i + 2] > 246)) continue;
        if (x < xa) xa = x; if (x > xb) xb = x; if (y < ya) ya = y; if (y > yb) yb = y;
      }
    }
    if (xb < 0) return { src: img.src, ratio: w0 / h0 };
    const cw = xb - xa + 1, ch = yb - ya + 1;
    const cv2 = document.createElement('canvas');
    cv2.width = cw; cv2.height = ch;
    cv2.getContext('2d').drawImage(cv, xa, ya, cw, ch, 0, 0, cw, ch);
    return { src: cv2.toDataURL('image/png'), ratio: cw / ch };
  } catch (e) {
    return { src: img.src, ratio: w0 / h0 };
  }
}

OPS.forEach(op => {

  caixa.appendChild(img);
  cap.append(punt, caixa);
  const text = document.createElement('span');
  el.append(cap, text);
  llistaEl.appendChild(el);
  files[op] = { el, cap, punt, caixa, img, text, actiu: false };
  const carrega = new Image();

  carrega.src = LOGOS[op];
});

const textMissatge = a => `<strong>${a}:</strong> ${MISSATGES[a]}.`;
const actiusAny = a => OPS.filter(op => valor(op, a) > 0)
  .sort((x, y) => valor(y, a) - valor(x, a) || OPS.indexOf(x) - OPS.indexOf(y));
const MARGE_MISSATGE = 8;

/* Disposició del panell, calculada un sol cop per mida (no a cada any). Hi ha
   dues mides de logo com a molt: la gran, la que fan servir tots els anys en
   què hi cap, i una de reduïda només per als anys en què no hi cap (els que
   tenen moltes files i, a més, missatge a sota) */
let disposicio = null;
function calculaDisposicio() {
  const panell = document.getElementById('panell');
  const total = panell.querySelector('.panell-total');
  const W = panell.clientWidth;
  const H = panell.clientHeight - total.offsetHeight - parseFloat(getComputedStyle(total).marginBottom);
  if (W < 1 || H < 1) return null;
  const mob = esMobil(), fs = mob ? 12.5 : 14, gap = mob ? 6 : 10, GAPCOL = 12;
  const ALT_TEXT = fs * 1.35;
  const R = xarxa ? xarxa.R : 4;                       // cercle del mateix radi que al mapa
  const puntW = 2 * R + 2 + (mob ? 5 : 6);

  // Alçada de cada missatge (amb el marge de sobre)
  caixaMissatge.style.maxWidth = W + 'px';
  caixaMissatge.style.display = '';
  const altMsg = {};
  for (const a of Object.keys(MISSATGES)) {
    caixaMissatge.innerHTML = textMissatge(+a);
    altMsg[a] = caixaMissatge.offsetHeight + MARGE_MISSATGE;
  }
  caixaMissatge.style.display = 'none';
  const ampleFila = (op, a) => mesuraText(nomOp(op, a) + ': ', fs, 'Roboto', 400) +
    mesuraText(formatNum(valor(op, a)), fs, 'Roboto', 700);

  // Disposició que fa cabre tots els anys d'un grup
  function perGrup(anys) {
    const filaPer = cols => {
      const fc = Math.ceil(FILES_MAX / cols);
      return d3.min(anys, a => (H - (altMsg[a] || 0)) / Math.max(1, Math.min(actiusAny(a).length, fc)));
    };
    // Una columna si les files hi caben amb prou aire; si no, dues (mai tres)
    const cols = filaPer(1) >= 28 ? 1 : 2;
    const filesCol = Math.ceil(FILES_MAX / cols);
    const filaH = Math.max(ALT_TEXT, cols === 1 ? Math.min(filaPer(1), 42) : filaPer(2));
    const colW = (W - (cols - 1) * GAPCOL) / cols;
    // Amplada del text de cada columna: la màxima dels anys del grup
    const textCol = d3.range(cols).map(c => d3.max(anys, a =>
      d3.max(actiusAny(a).slice(c * filesCol, (c + 1) * filesCol), op => ampleFila(op, a)) || 0));
    // Logo i text en línia, o el text a sota del logo: la que permet logos més grans
    const RATIO = mob ? 2.4 : 3.2, LH_MAX = cols === 1 ? 30 : 40;
    const lhLinia = Math.max(ALT_TEXT - 2, Math.min(filaH - 4, LH_MAX));
    const lwLinia = Math.max(16, Math.min(
      (W - (cols - 1) * GAPCOL - d3.sum(textCol, t => puntW + gap + t)) / cols, lhLinia * RATIO));
    const lhApilat = Math.min(filaH - ALT_TEXT - 3, LH_MAX);
    const lwApilat = Math.min(colW - puntW, lhApilat * RATIO);
    const mida = (lw, lh) => Math.min(lh, Math.sqrt(lw * lh * 0.42 / 3));   // alçada d'un logo típic
    const apilat = lhApilat > 0 && mida(lwApilat, lhApilat) > mida(lwLinia, lhLinia) * 1.1;
    const LH = apilat ? lhApilat : lhLinia, LW = apilat ? lwApilat : lwLinia;
    const ampleCol = textCol.map(t => (apilat ? Math.max(puntW + LW, t) : puntW + LW + gap + t));
    const xCol = ampleCol.map((a, c) => d3.sum(ampleCol.slice(0, c)) + c * GAPCOL);
    const ample = Math.min(W, d3.sum(ampleCol) + (cols - 1) * GAPCOL);
    const alt = d3.max(anys, a => Math.min(actiusAny(a).length, filesCol) * filaH + (altMsg[a] || 0));
    const cap = a => Math.min(actiusAny(a).length, filesCol) * filaH + (altMsg[a] || 0) <= H + 0.5;
    return { R, puntW, gap, filesCol, filaH, apilat, LH, LW, xCol, ample, alt, cap };
  }

  // Mida gran: la dels anys sense missatge; els anys amb missatge que hi caben
  // també la fan servir. La resta comparteixen una mida reduïda.
  const sense = ANYS.filter(a => !MISSATGES[a]);
  const prova = perGrup(sense);
  const grans = ANYS.filter(a => !MISSATGES[a] || prova.cap(a));
  const petits = ANYS.filter(a => !grans.includes(a));
  const gran = perGrup(grans);
  const petita = petits.length ? perGrup(petits) : null;
  const perAny = Object.fromEntries(ANYS.map(a => [a, petits.includes(a) ? petita : gran]));

  // La llista té una mida fixa (la més gran de les dues) perquè el total no es mogui
  const ample = Math.max(gran.ample, petita ? petita.ample : 0);
  llistaEl.style.width = ample + 'px';
  llistaEl.style.height = Math.min(H, Math.max(gran.alt, petita ? petita.alt : 0)) + 'px';
  [gran, petita].forEach(d => { if (d) d.x0 = (ample - d.ample) / 2; });
  return { perAny };
}

function dibuixaPanell() {
  disposicio = calculaDisposicio();
  actualitzaPanell(false);
}

function actualitzaPanell(animat = true) {
  document.getElementById('total-xifra').textContent = formatNum(totalAny(anyActual));
  if (!disposicio) disposicio = calculaDisposicio();
  if (!disposicio) return;
  const { R, puntW, gap, filesCol, filaH, apilat, LH, LW, xCol, x0 } = disposicio.perAny[anyActual];
  const actius = actiusAny(anyActual);

  // Missatge just a sota de la darrera fila
  const msg = MISSATGES[anyActual];
  if (msg) {
    caixaMissatge.innerHTML = textMissatge(anyActual);
    caixaMissatge.style.top = (Math.min(actius.length, filesCol) * filaH + MARGE_MISSATGE) + 'px';
  }
  caixaMissatge.style.display = msg ? '' : 'none';

  OPS.forEach(op => {
    const f = files[op], i = actius.indexOf(op);
    f.el.classList.toggle('apilat', apilat);
    f.el.style.height = filaH + 'px';
    f.el.style.gap = apilat ? '1px' : gap + 'px';
    f.punt.style.width = f.punt.style.height = 2 * R + 'px';
    f.cap.style.gap = (puntW - 2 * R - 2) + 'px';
    f.caixa.style.width = LW + 'px';
    f.caixa.style.height = LH + 'px';
    const r = logos[op] ? logos[op].ratio : 3;
    const A = LW * LH * 0.42;
    let h = Math.min(LH, Math.sqrt(A / r)), w = h * r;
    if (w > LW) { w = LW; h = w / r; }
    f.img.style.width = w + 'px';
    f.img.style.height = h + 'px';
    if (i < 0) {
      f.el.style.opacity = 0;
      f.actiu = false;
      return;
    }
    f.text.innerHTML = `${nomOp(op, anyActual)}: <b>${formatNum(valor(op, anyActual))}</b>`;
    const tr = `translate(${x0 + xCol[Math.floor(i / filesCol)]}px, ${(i % filesCol) * filaH}px)`;
    if (!f.actiu || !animat) {
      // Una fila nova apareix directament al seu lloc
      f.el.style.transition = 'none';
      f.el.style.transform = tr;
      void f.el.offsetWidth;
      f.el.style.transition = '';
    } else f.el.style.transform = tr;
    f.el.style.opacity = 1;
    f.actiu = true;
  });
}

/* ===================== BLOC 2: COLUMNES APILADES ===================== */
const svg2 = d3.select('#svg2');
let b2 = null;
let filtre = null;           // operador seleccionat amb un clic

const htmlSegment = d => `<strong>${nomOp(d.op, d.any)}</strong><br>Any: ${d.any}.<br>Bicicletes: ${formatNum(d.v)}.`;

function dibuixaBloc2() {
  svg2.selectAll('*').remove();
  b2 = null;
  const el = document.getElementById('grafic2');
  const TW = el.clientWidth, TH = el.clientHeight;
  if (TW < 1 || TH < 1) return;
  svg2.attr('width', TW).attr('height', TH);
  const MD = mides(), x = escalaAnys(TW);

  // Botons «!»: al costat de l'any si hi caben; si no, a sota
  const R_AV = 6.5;
  const ampleAny = mesuraText('2000', MD.eix, 'Roboto', 700);
  const grup = ampleAny + 2 + 2 * R_AV;
  const alCostat = grup + 1 <= x.step();
  const dalt = MD.eix + 6;
  const yBase = TH - 20 - (alCostat ? 0 : 2 * R_AV + 4);

  const segs = [];
  ANYS.forEach(a => {
    let acc = 0;
    OPS.forEach(op => { const v = valor(op, a); if (v > 0) { segs.push({ any: a, op, v, y0: acc }); acc += v; } });
  });
  const rects = svg2.append('g').selectAll('rect').data(segs).join('rect')
    .attr('x', d => x(d.any)).attr('width', x.bandwidth())
    .attr('fill', d => COLORS[d.op]).style('cursor', 'pointer')
    .on('mouseover', (ev, d) => { if (potHover()) { showTooltip(htmlSegment(d)); moveTooltip(ev); } })
    .on('mousemove', ev => { if (potHover()) moveTooltip(ev); })
    .on('mouseout', () => { if (potHover()) hideTooltip(); })
    .on('click', (ev, d) => {
      ev.stopPropagation();
      tancaPopups();
      filtre = filtre === d.op ? null : d.op;
      posicionaBloc2(true);
      showTooltip(htmlSegment(d));
      moveTooltip(ev);
    });

  const valors = svg2.append('g').selectAll('text').data(ANYS).join('text')
    .attr('x', d => x.c(d)).attr('text-anchor', 'middle')
    .style('font-family', 'Roboto, sans-serif').style('font-size', MD.eix + 'px').style('font-weight', 700)
    .attr('fill', '#232323').style('pointer-events', 'none');

  const notes = Object.keys(MISSATGES).map(Number);
  const visibles = anysVisibles(x, ANYS, 700);
  const eix = svg2.append('g').selectAll('text').data(visibles).join('text')
    .attr('x', d => (alCostat && MISSATGES[d] ? x.c(d) - grup / 2 : x.c(d)))
    .attr('text-anchor', d => (alCostat && MISSATGES[d] ? 'start' : 'middle'))
    .attr('y', yBase + 15)
    .style('font-family', 'Roboto, sans-serif').style('font-size', MD.eix + 'px').text(d => d);

  const popup = document.getElementById('popup-nota');
  svg2.append('g').selectAll('g').data(notes).join('g')
    .attr('role', 'button').attr('tabindex', 0).attr('aria-label', d => `Nota de ${d}`)
    .style('cursor', 'pointer')
    .attr('transform', d => (alCostat
      ? `translate(${x.c(d) - grup / 2 + ampleAny + 2 + R_AV},${yBase + 15 - MD.eix * 0.35})`
      : `translate(${x.c(d)},${yBase + 20 + R_AV + 2})`))
    .each(function (d) {
      const g = d3.select(this);
      g.append('circle').attr('r', R_AV).attr('fill', '#e8e8e0').attr('stroke', '#bbb');
      g.append('text').attr('text-anchor', 'middle').attr('dy', '0.35em')
        .style('font-family', 'Roboto, sans-serif').style('font-size', MD.eix + 'px').style('font-weight', 700)
        .attr('fill', '#232323').text('!');
      setupInfo(this, popup, `<p style="margin:0"><strong>${d}</strong><br>${MISSATGES[d]}.</p>`);
    });

  b2 = { x, rects, valors, eix, yBase, dalt, MD };
  posicionaBloc2(false);
}

function posicionaBloc2(animat) {
  if (!b2) return;
  const { x, rects, valors, yBase, dalt, MD } = b2;
  const valorAny = a => (filtre ? valor(filtre, a) : totalAny(a));
  const max = d3.max(ANYS, valorAny);
  const y = d3.scaleLinear([0, max], [yBase, dalt]);
  const t = sel => (animat ? sel.transition().duration(600).ease(d3.easeCubicInOut) : sel);
  const visible = d => !filtre || d.op === filtre;

  rects.style('pointer-events', d => (visible(d) ? null : 'none'));
  t(rects)
    .attr('y', d => (visible(d) ? y((filtre ? 0 : d.y0) + d.v) : yBase))
    .attr('height', d => (visible(d) ? y(filtre ? 0 : d.y0) - y((filtre ? 0 : d.y0) + d.v) : 0))
    .attr('opacity', d => (visible(d) ? 1 : 0));

  // Etiquetes de valor; si dues se solapen, s'elimina la de l'esquerra
  valors.text(d => (valorAny(d) > 0 ? formatNum(valorAny(d)) : ''));
  const amples = new Map(ANYS.map(a => [a, mesuraText(formatNum(valorAny(a)), MD.eix, 'Roboto', 700)]));
  const amb = ANYS.filter(a => valorAny(a) > 0);
  const amagades = new Set();
  for (let i = 0; i < amb.length - 1; i++) {
    const a = amb[i], b = amb[i + 1];
    const solapen = x.c(a) + amples.get(a) / 2 + 3 > x.c(b) - amples.get(b) / 2 &&
      Math.abs(y(valorAny(a)) - y(valorAny(b))) < MD.eix + 2;
    if (solapen) amagades.add(a);
  }
  t(valors).attr('y', d => y(valorAny(d)) - 4)
    .attr('opacity', d => (amagades.has(d) || valorAny(d) === 0 ? 0 : 1));
  actualitzaBloc2();
}

function actualitzaBloc2() {
  if (!b2) return;
  b2.rects.style('fill-opacity', d => (d.any > anyActual ? 0.5 : 1));
  b2.valors.style('fill-opacity', d => (d > anyActual ? 0.5 : 1));
  b2.eix.attr('fill', d => (d === anyActual ? '#232323' : '#4f4f4f'))
    .style('font-weight', d => (d === anyActual ? 700 : 400));
}

/* ===================== DIBUIX ===================== */
function draw() {
  dibuixaCrono();
  dibuixaMapa();
  dibuixaPanell();
  dibuixaBloc2();
}

/* Redibuix en canviar la mida i quan han carregat les fonts: les mesures de
   text en depenen, i Google Fonts no descarrega una font fins que es fa servir */
let rafId;
function programaDraw() { cancelAnimationFrame(rafId); rafId = requestAnimationFrame(draw); }
if (window.ResizeObserver) {
  const ro = new ResizeObserver(programaDraw);
  ro.observe(document.getElementById('mapa-wrapper'));
  ro.observe(document.getElementById('crono-pista'));
} else window.addEventListener('resize', programaDraw);
if (document.fonts) {
  const FONTS = ['400 12.5px Roboto', '700 12.5px Roboto', '400 14px Merriweather', '700 15px Merriweather'];
  Promise.all(FONTS.map(f => document.fonts.load(f))).then(draw, () => {});
}
draw();

/* La reproducció automàtica comença quan la infografia és visible */
if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver(entrades => {
    if (entrades.some(e => e.isIntersecting)) { io.disconnect(); if (!autoIniciat) iniciaPlay(); }
  }, { threshold: 0.4 });
  io.observe(document.querySelector('.infografia-container'));
} else iniciaPlay();
</script>
